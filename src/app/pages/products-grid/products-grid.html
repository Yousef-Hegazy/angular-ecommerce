<div
  class="products-page-container px-4 sm:px-6 lg:px-8 py-8 sm:py-12 max-w-[1200px] mx-auto space-y-10"
>
  <!-- 1. Editorial Hero & Catalog Header -->
  <app-products-catalog-header
    [activeCount]="filteredProducts().length"
    [totalCount]="products().length"
  />

  <!-- 2. Controls Toolbar: Category Pills, Live Search & Sort Select -->
  <section class="space-y-5">
    <!-- Category Filter Strip -->
    <div
      class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none"
      role="tablist"
      aria-label="Product categories"
    >
      @for (cat of categories; track cat.id) {
        <app-category-chip
          [id]="cat.id"
          [label]="cat.label"
          [isSelected]="selectedCategory() === cat.id"
          (selected)="selectCategory($event)"
        />
      }
    </div>

    <!-- Sub-toolbar: Inline Search & Sorting Control -->
    <app-products-toolbar
      [searchQuery]="searchQuery()"
      [currentSort]="currentSort()"
      (searchChange)="updateSearch($event)"
      (sortChange)="currentSort.set($event)"
    />
  </section>

  <!-- 3. Responsive Products Grid & Empty State Fallback -->
  <section aria-label="Products catalog">
    @if (filteredProducts().length > 0) {
      <div
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 sm:gap-7"
      >
        @for (product of filteredProducts(); track product.id) {
          <app-product-card
            [product]="product"
            [isWishlisted]="isWishlisted(product.id)"
            (addToBag)="addToBag($event)"
            (toggleWishlist)="toggleWishlist($event)"
            (quickView)="openQuickView($event)"
          />
        }
      </div>
    } @else {
      <app-products-empty-state
        [searchQuery]="searchQuery()"
        (reset)="resetFilters()"
      />
    }
  </section>
</div>
